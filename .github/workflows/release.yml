name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build and test portable package
        shell: powershell
        run: .\build.ps1
      - name: Verify packaged doctor command
        shell: powershell
        run: |
          $result = & .\dist\AgentCommander\AgentCommanderMCP.exe doctor --json | ConvertFrom-Json
          if ($result.version -ne '0.2.1' -or $null -eq $result.checks) { throw "Packaged doctor returned invalid JSON" }
      - uses: actions/upload-artifact@v4
        with:
          name: AgentCommander-Portable
          path: |
            dist/AgentCommander-Portable.zip
            dist/AgentCommander-Portable.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AgentCommander-Portable.zip
            dist/AgentCommander-Portable.zip.sha256
